name = "agnt-gm-ai"
main = "worker/index.js"
compatibility_date = "2026-01-15"

# Custom domain — the apex and www both point at this Worker. Cloudflare
# auto-provisions edge certs and the proxy A records. Requires the agnt-gm.ai
# zone to be on the same Cloudflare account that owns the Worker; if not, the
# CLI deploy will fail and you'll need to add the routes from the dashboard.
#
# STILL ACTIVE ON PURPOSE. A Custom Domain captures the WHOLE hostname, so
# while these two lines stand, this Worker answers for / and /app alike and the
# promo site cannot take the apex. Deploying the /app support first — with the
# host arrangement untouched — is what makes this change safe to ship on its
# own: nothing about today's traffic changes.
# Custom Domains сняты в дашборде 26 июля — апекс освобождён под промо-сайт.
# Оставлены здесь для отката: вернуть эти три строки и задеплоить, если нужно
# отдать весь хост обратно мини-аппу.
# routes = [
#   { pattern = "agnt-gm.ai", custom_domain = true },
#   { pattern = "www.agnt-gm.ai", custom_domain = true },
# ]

# ── CUTOVER: swap the block above for the one below ───────────────────────────
# Order matters (docs/apex-migration.md in agntdev/agnt-promo):
#   1. remove the two Custom Domains in the Cloudflare dashboard
#   2. add proxied DNS records for the apex and www
#   3. swap the comment here and `npx wrangler deploy`
#   4. deploy agnt-promo with its routes uncommented
# Doing 3 before 1 leaves the apex with no Worker at all.
#
routes = [
  { pattern = "agnt-gm.ai/app*", zone_name = "agnt-gm.ai" },
]

# Worker + Static Assets: serves the built Vite SPA and proxies /api/* to
# the upstream Builder API. Run `npm run build` first to populate ./dist,
# then `npm run deploy`.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Observability: enable Workers logs in the dashboard.
[observability]
enabled = true
